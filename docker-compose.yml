services:
  postgres:
    image: postgres:16-alpine
    container_name: fitmoi_db
    environment:
      POSTGRES_DB: fitmoi
      POSTGRES_USER: fitmoi
      POSTGRES_PASSWORD: fitmoi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitmoi_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fitmoi.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
